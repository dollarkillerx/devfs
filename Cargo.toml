[package]
name = "devfs"
version = "0.1.0"
edition = "2021"
description = "S3-compatible object storage service for development and testing"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
percent-encoding = "2"
bytes = "1"
mime_guess = "2"
serde_json = "1"
http-body-util = "0.1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
